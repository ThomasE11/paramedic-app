    <rect x="21" y="22" width="160" height="95" rx="14" fill="#082f49" stroke="#67e8f9" stroke-width="4"/>
    <text x="101" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#bae6fd">CORE TARGET</text>
    <text x="101" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="900" fill="#ecfeff">37.5°C</text>
    <circle cx="52" cy="158" r="18" fill="#0ea5e9" stroke="#bae6fd" stroke-width="4"/>
    <circle cx="101" cy="158" r="18" fill="#10b981" stroke="#a7f3d0" stroke-width="4"/>
    <circle cx="150" cy="158" r="18" fill="#64748b" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="29" y="205" width="144" height="42" rx="13" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <path d="M44 227h20l7-12 11 25 13-20 11 7h52" fill="none" stroke="#34d399" stroke-width="4" stroke-linejoin="round"/>
