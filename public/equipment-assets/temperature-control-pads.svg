<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Feedback-controlled surface temperature system</title>
  <desc id="desc">Temperature controller with core probe and water-circulating torso and thigh pads for fever prevention after return of spontaneous circulation.</desc>
  <defs>
    <linearGradient id="controller" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cffafe" stop-opacity=".94"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".78"/><stop offset="1" stop-color="#0e7490" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".34"/></filter>
    <pattern id="channels" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 11h22M11 0v22" stroke="#ecfeff" stroke-opacity=".45" stroke-width="2"/></pattern>
  </defs>
  <rect x="24" y="26" width="592" height="366" rx="42" fill="#e2e8f0" stroke="#64748b" stroke-width="6" filter="url(#shadow)"/>
  <g transform="translate(48 66)" filter="url(#shadow)">
