  <g font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">
    <text x="108" y="224">MAGILL FORCEPS</text>
    <text x="217" y="224">LARYNGOSCOPE</text>
    <text x="292" y="224">SUCTION</text>
  </g>
