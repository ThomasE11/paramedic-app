<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Direct-vision foreign-body removal kit</title>
  <desc id="desc">Magill forceps, laryngoscope, suction catheter and oxygen connection for airway foreign-body removal.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#475569"/><stop offset=".45" stop-color="#f8fafc"/><stop offset="1" stop-color="#64748b"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#020617" flood-opacity=".3"/></filter>
  </defs>
  <rect x="12" y="14" width="336" height="232" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  <text x="180" y="42" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="900" fill="#0f3d57" letter-spacing=".6">DIRECT-VISION REMOVAL</text>
  <g filter="url(#shadow)">
    <path d="M76 80c45 20 69 53 82 106" fill="none" stroke="url(#steel)" stroke-width="8" stroke-linecap="round"/>
    <path d="M111 69c27 39 34 74 32 116" fill="none" stroke="url(#steel)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="69" cy="76" r="22" fill="none" stroke="#64748b" stroke-width="7"/>
    <circle cx="109" cy="63" r="22" fill="none" stroke="#64748b" stroke-width="7"/>
    <path d="m156 181 13 13M141 183l-8 17" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
    <path d="M197 74h31v107h-31Z" fill="url(#handle)" stroke="#020617" stroke-width="4"/>
    <path d="M212 73c12-25 42-34 69-20l-5 16c-24-7-39 3-48 18Z" fill="url(#steel)" stroke="#475569" stroke-width="3"/>
    <circle cx="212" cy="99" r="8" fill="#eab308" stroke="#713f12" stroke-width="3"/>
    <path d="M259 101c36 8 48 33 43 80" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M258 101c36 8 48 33 43 80" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round"/>
    <rect x="287" y="176" width="28" height="18" rx="6" fill="#0f766e" stroke="#134e4a" stroke-width="3"/>
